name: Temporary TTS model benchmark bundle

on:
  push:
    branches:
      - tmp/tts-model-benchmark-20260819

permissions:
  contents: read

jobs:
  bundle-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download optimized Kokoro model variants
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p models
          curl -fL --retry 5 \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.fp16.onnx \
            -o models/kokoro-v1.0.fp16.onnx
          curl -fL --retry 5 \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx \
            -o models/kokoro-v1.0.onnx
          sha256sum models/*
          ls -lh models

      - name: Upload model variants
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-model-variants
          path: models
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
